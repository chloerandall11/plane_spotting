<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Plane Spotter</title>
<style>
  :root {
    --bg: #0e0f12;
    --card: #1a1c20;
    --border: #2a2d33;
    --text: #f2f2f2;
    --text-dim: #9a9ea6;
    --accent: #4da3ff;
    --good: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  #app { width: 100%; max-width: 420px; }
  h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: lowercase;
    letter-spacing: 0.02em;
    margin: 4px 0 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 10px; }
  button {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #24262b;
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0e0f12; font-weight: 600; }
  input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #101216;
    color: var(--text);
    font-size: 15px;
  }
  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .stat-big { font-size: 26px; font-weight: 600; }
  .stat-sub { color: var(--text-dim); font-size: 14px; }
  .pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    background: #24262b;
    color: var(--text-dim);
    margin: 0 6px 6px 0;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .pill.active { border-color: var(--accent); color: var(--accent); }
  .comment { background: #101216; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 12px 0; }
  .hist-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .hist-item .sub { color: var(--text-dim); font-size: 12px; }
  .tabbar { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabbar button { background: none; border: none; color: var(--text-dim); font-size: 14px; padding: 8px; }
  .tabbar button.active { color: var(--text); font-weight: 600; border-bottom: 2px solid var(--accent); border-radius: 0; }
  .status { text-align: center; color: var(--text-dim); padding: 40px 0; }
</style>
</head>
<body>
<div id="app">
  <h1>plane spotter</h1>

  <div class="tabbar">
    <button id="tabSpot" class="active" onclick="showTab('spot')">spot</button>
    <button id="tabHistory" onclick="showTab('history')">history</button>
  </div>

  <div id="spotView"></div>
  <div id="historyView" style="display:none;"></div>
</div>

<script>
let userLat = null, userLon = null;
let currentCandidate = null;
let stage = "prompt"; // prompt | guess | reveal | loading | none

function showTab(tab) {
  document.getElementById('tabSpot').classList.toggle('active', tab === 'spot');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('spotView').style.display = tab === 'spot' ? 'block' : 'none';
  document.getElementById('historyView').style.display = tab === 'history' ? 'block' : 'none';
  if (tab === 'history') loadHistory('all');
}

function render() {
  const el = document.getElementById('spotView');
  if (stage === "loading") {
    el.innerHTML = `<div class="status">finding something overhead...</div>`;
  } else if (stage === "none") {
    el.innerHTML = `
      <div class="card status">
        nothing close enough right now<br><br>
        <button class="primary" onclick="fetchNext()">try again</button>
      </div>`;
  } else if (stage === "prompt") {
    el.innerHTML = `
      <div class="card">
        <div class="stat-sub">overhead now</div>
        <div class="stat-big">${currentCandidate.altitude_ft.toLocaleString()} ft</div>
        <div class="stat-sub">${currentCandidate.distance_km} km away · ${currentCandidate.category_hint}</div>
        <div style="margin:16px 0;font-size:15px;">look roughly <b>${currentCandidate.compass}</b></div>
        <div class="row">
          <button onclick="skip()">skip</button>
          <button class="primary" onclick="goGuess()">yes, i see it</button>
        </div>
      </div>`;
  } else if (stage === "guess") {
    const showRoute = currentCandidate.category_hint === "commercial";
    el.innerHTML = `
      <div class="card">
        <label>airline / operator</label>
        <input id="gAirline" placeholder="e.g. ryanair">
        ${showRoute ? `
        <label>origin</label>
        <input id="gOrigin" placeholder="e.g. stansted">
        <label>destination</label>
        <input id="gDest" placeholder="e.g. dublin">` : ""}
        <div class="row">
          <button onclick="reveal(true)">can't see it anymore</button>
          <button class="primary" onclick="reveal(false)">reveal</button>
        </div>
      </div>`;
  } else if (stage === "reveal") {
    const r = currentCandidate.revealed;
    el.innerHTML = `
      <div class="card">
        <div class="stat-big">${r.callsign}</div>
        <div class="stat-sub">${r.operator || r.category} · ${r.altitude_ft.toLocaleString()} ft · ${r.distance_km} km</div>
        <div class="comment">${currentCandidate.comment}</div>
        <button class="primary" onclick="fetchNext()">spot another</button>
      </div>`;
  }
}

async function getLocation() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      pos => resolve([pos.coords.latitude, pos.coords.longitude]),
      err => reject(err),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

async function fetchNext() {
  stage = "loading"; render();
  try {
    if (userLat === null) [userLat, userLon] = await getLocation();
    const res = await fetch(`/api/next?lat=${userLat}&lon=${userLon}`);
    const data = await res.json();
    if (!data.found) { stage = "none"; render(); return; }
    currentCandidate = data;
    stage = "prompt"; render();
  } catch (e) {
    document.getElementById('spotView').innerHTML =
      `<div class="card status">couldn't get your location - allow location access and reload</div>`;
  }
}

async function skip() {
  stage = "loading"; render();
  const res = await fetch('/api/skip', { method: 'POST' });
  const data = await res.json();
  if (!data.found) { stage = "none"; render(); return; }
  currentCandidate = data;
  stage = "prompt"; render();
}

function goGuess() { stage = "guess"; render(); }

async function reveal(lostSight) {
  const guess = lostSight ? {} : {
    airline: document.getElementById('gAirline')?.value || "",
    origin: document.getElementById('gOrigin')?.value || "",
    destination: document.getElementById('gDest')?.value || "",
  };
  stage = "loading"; render();
  const res = await fetch('/api/reveal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ guess, lost_sight: lostSight }),
  });
  const data = await res.json();
  currentCandidate.revealed = data.revealed;
  currentCandidate.comment = data.comment;
  stage = "reveal"; render();
}

let activeFilter = 'all';
async function loadHistory(filter) {
  activeFilter = filter;
  const res = await fetch(`/api/history?category=${filter}`);
  const items = await res.json();
  const pills = ['all', 'commercial', 'military', 'private'].map(f =>
    `<span class="pill ${f === activeFilter ? 'active' : ''}" onclick="loadHistory('${f}')">${f}</span>`
  ).join('');
  const rows = items.length ? items.map(h => `
    <div class="hist-item">
      ${h.callsign || 'unidentified'}
      <div class="sub">${h.category}${h.operator ? ' · ' + h.operator : ''} · ${h.outcome === 'lost_sight' ? 'lost sight' : 'guessed'}</div>
    </div>`).join('') : `<div class="status">no spots yet</div>`;

  document.getElementById('historyView').innerHTML = `
    <div class="card">
      <div class="stat-sub" style="margin-bottom:12px;">${items.length} spotted</div>
      <div style="margin-bottom:8px;">${pills}</div>
      ${rows}
    </div>`;
}

fetchNext();
</script>
</body>
</html>
