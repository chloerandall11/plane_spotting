<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Plane Spotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0F0D;
    --panel: #101C17;
    --panel-raised: #14241D;
    --hairline: #1E332B;
    --phosphor: #5EFFA0;
    --phosphor-dim: #2E7A56;
    --amber: #FFB454;
    --amber-dim: #8A6530;
    --text: #E8F5EE;
    --text-dim: #6B8F80;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(94,255,160,0.06), transparent);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
    padding: 18px;
    min-height: 100vh;
  }
  #app { width: 100%; max-width: 420px; }

  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--phosphor-dim);
    display: flex; align-items: center; gap: 8px; margin: 2px 0 18px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--phosphor);
    box-shadow: 0 0 6px var(--phosphor); animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .card {
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 4px;
    padding: 22px; margin-bottom: 16px; position: relative;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--phosphor-dim), transparent 60%);
  }

  button {
    flex: 1; padding: 14px; border-radius: 3px; border: 1px solid var(--hairline);
    background: var(--panel-raised); color: var(--text); font-family: var(--sans);
    font-size: 14px; font-weight: 500; cursor: pointer; transition: border-color 0.15s;
  }
  button:hover { border-color: var(--text-dim); }
  button:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }
  button.primary { background: var(--phosphor); border-color: var(--phosphor); color: #04140C; font-weight: 600; }
  button.ghost { background: none; }
  .row { display: flex; gap: 10px; }

  label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--amber-dim); display: block; margin-bottom: 6px;
  }
  input {
    width: 100%; padding: 12px; margin-bottom: 14px; border-radius: 3px;
    border: 1px solid var(--hairline); background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px;
  }
  input:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 1px; }

  /* --- Compass (signature element) --- */
  .rose-wrap { display: flex; justify-content: center; margin: 4px 0 6px; position: relative; }
  .rose { width: 176px; height: 176px; }
  .rose-ring { fill: none; stroke: var(--hairline); stroke-width: 1; }
  .rose-tick { stroke: var(--text-dim); stroke-width: 1; }
  .rose-tick.major { stroke: var(--phosphor-dim); stroke-width: 1.5; }
  .rose-label { fill: var(--text-dim); font-family: var(--mono); font-size: 9px; text-anchor: middle; }
  .rose-label.north { fill: var(--amber); font-weight: 700; }
  .heading-wedge { fill: var(--phosphor); opacity: 0.18; transition: transform 0.15s linear; transform-origin: 88px 88px; }
  .target-needle { transition: transform 0.4s cubic-bezier(.2,.9,.3,1); transform-origin: 88px 88px; }
  .target-needle.aligned .needle-line { stroke: var(--phosphor); filter: drop-shadow(0 0 6px var(--phosphor)); }
  .needle-line { stroke: var(--amber); stroke-width: 2.5; transition: stroke 0.2s; }
  .rose-center { fill: var(--bg); stroke: var(--text-dim); stroke-width: 1.5; }
  .align-pulse { fill: none; stroke: var(--phosphor); stroke-width: 1.5; opacity: 0; }
  .align-pulse.active { animation: pulse-ring 1.4s ease-out infinite; }
  @keyframes pulse-ring {
    0% { r: 46; opacity: 0.7; } 100% { r: 82; opacity: 0; }
  }

  .aligned-tag {
    text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--phosphor); height: 16px; margin-bottom: 6px;
  }

  .readout { text-align: center; }
  .readout-alt { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: -0.01em; line-height: 1; }
  .readout-sub { font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-top: 8px; }
  .readout-dir { font-size: 15px; margin-top: 12px; color: var(--text-dim); }
  .readout-dir b { color: var(--amber); font-family: var(--mono); font-weight: 600; }

  .badge {
    display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 3px;
    border: 1px solid var(--amber-dim); color: var(--amber);
  }

  .compass-permission { text-align: center; padding: 10px 0 4px; }
  .compass-permission .hint { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }

  .sweep-wrap { display: flex; flex-direction: column; align-items: center; padding: 30px 0; gap: 16px; }
  .sweep { width: 90px; height: 90px; border-radius: 50%; border: 1px solid var(--hairline); position: relative; overflow: hidden; }
  .sweep::after {
    content: ''; position: absolute; inset: 0;
    background: conic-gradient(from 0deg, var(--phosphor) 0deg, transparent 60deg);
    animation: rotate 1.6s linear infinite; opacity: 0.55;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }
  .sweep-label { font-family: var(--mono); font-size: 12px; color: var(--text-dim); letter-spacing: 0.04em; }

  .strip { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .callsign { font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: 0.02em; }
  .meta-line { font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
  .comment {
    font-family: var(--sans); font-style: italic; font-size: 14px; color: var(--text);
    background: var(--bg); border-left: 2px solid var(--phosphor-dim);
    padding: 10px 14px; border-radius: 0 3px 3px 0; margin-bottom: 4px;
  }

  .tabbar { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--hairline); }
  .tabbar button {
    flex: none; background: none; border: none; border-radius: 0; color: var(--text-dim);
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0 0 12px; position: relative;
  }
  .tabbar button.active { color: var(--phosphor); }
  .tabbar button.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--phosphor); box-shadow: 0 0 6px var(--phosphor);
  }

  .pill {
    display: inline-block; font-family: var(--mono); font-size: 11px; padding: 5px 10px;
    border-radius: 3px; background: var(--panel-raised); color: var(--text-dim);
    margin: 0 6px 6px 0; cursor: pointer; border: 1px solid var(--hairline);
  }
  .pill.active { border-color: var(--phosphor); color: var(--phosphor); }
  .hist-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--hairline); font-family: var(--mono); font-size: 13px;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-item .sub { color: var(--text-dim); font-size: 11px; font-family: var(--sans); margin-top: 2px; }

  .status { text-align: center; color: var(--text-dim); padding: 30px 0; font-family: var(--sans); font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <div class="eyebrow"><span class="dot"></span> plane spotter</div>
  <div class="tabbar">
    <button id="tabSpot" class="active" onclick="showTab('spot')">Spot</button>
    <button id="tabHistory" onclick="showTab('history')">Log</button>
  </div>
  <div id="spotView"></div>
  <div id="historyView" style="display:none;"></div>
</div>

<script>
let userLat = null, userLon = null;
let currentCandidate = null;
let stage = "prompt";
let deviceHeading = null;   // live compass heading, null until available
let compassActive = false;
let referenceData = { airlines: [], airports: [] };

fetch('/api/reference-data').then(r => r.json()).then(d => { referenceData = d; });

function showTab(tab) {
  document.getElementById('tabSpot').classList.toggle('active', tab === 'spot');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('spotView').style.display = tab === 'spot' ? 'block' : 'none';
  document.getElementById('historyView').style.display = tab === 'history' ? 'block' : 'none';
  if (tab === 'history') loadHistory(activeFilter || 'all');
}

/* ---------- compass rose rendering ---------- */
function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

function roseSVG() {
  const points = ['N','NE','E','SE','S','SW','W','NW'];
  const ticks = points.map((p, i) => {
    const angle = i * 45, major = true;
    const [x1, y1] = polarPoint(88, 88, 66, angle);
    const [x2, y2] = polarPoint(88, 88, 76, angle);
    const [lx, ly] = polarPoint(88, 88, 54, angle);
    return `<line class="rose-tick major" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>
            <text class="rose-label ${p === 'N' ? 'north' : ''}" x="${lx}" y="${ly + 3}">${p}</text>`;
  }).join('');
  return `
    <svg class="rose" viewBox="0 0 176 176">
      <circle class="align-pulse" id="alignPulse" cx="88" cy="88" r="46"/>
      <circle class="rose-ring" cx="88" cy="88" r="76"/>
      <circle class="rose-ring" cx="88" cy="88" r="46"/>
      ${ticks}
      <polygon class="heading-wedge" id="headingWedge" points="88,88 78,20 98,20"/>
      <g class="target-needle" id="targetNeedle">
        <line class="needle-line" x1="88" y1="88" x2="88" y2="24"/>
        <line class="needle-line" x1="88" y1="88" x2="88" y2="128" stroke-opacity="0.3"/>
      </g>
      <circle class="rose-center" cx="88" cy="88" r="4"/>
    </svg>`;
}

function updateRoseOrientation() {
  const wedge = document.getElementById('headingWedge');
  const needle = document.getElementById('targetNeedle');
  const pulse = document.getElementById('alignPulse');
  const tag = document.getElementById('alignedTag');
  if (!wedge || !needle || !currentCandidate) return;

  const target = currentCandidate.bearing_deg;

  if (deviceHeading !== null) {
    wedge.style.transform = `rotate(${deviceHeading}deg)`;
    wedge.style.opacity = '0.18';
  } else {
    wedge.style.opacity = '0';
  }
  needle.style.transform = `rotate(${target}deg)`;

  if (deviceHeading !== null) {
    const diff = Math.abs(((deviceHeading - target + 540) % 360) - 180);
    const aligned = diff < 12;
    needle.classList.toggle('aligned', aligned);
    if (pulse) pulse.classList.toggle('active', aligned);
    if (tag) tag.textContent = aligned ? 'facing it now' : '';
  }
}

/* ---------- device compass wiring ---------- */
function handleOrientation(event) {
  let heading = null;
  if (typeof event.webkitCompassHeading === 'number') {
    heading = event.webkitCompassHeading; // iOS Safari: already true compass heading
  } else if (event.absolute && event.alpha !== null) {
    heading = (360 - event.alpha) % 360; // Android: approximate
  }
  if (heading !== null) {
    deviceHeading = heading;
    compassActive = true;
    updateRoseOrientation();
  }
}

async function enableCompass() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const result = await DeviceOrientationEvent.requestPermission();
      if (result !== 'granted') return;
    } catch (e) { return; }
  }
  window.addEventListener('deviceorientationabsolute', handleOrientation, true);
  window.addEventListener('deviceorientation', handleOrientation, true);
  render();
}

/* ---------- rendering ---------- */
function render() {
  const el = document.getElementById('spotView');
  if (stage === "loading") {
    el.innerHTML = `<div class="card"><div class="sweep-wrap">
      <div class="sweep"></div>
      <div class="sweep-label">scanning nearby traffic&hellip;</div>
    </div></div>`;
  } else if (stage === "none") {
    el.innerHTML = `<div class="card status">nothing within range right now<br><br>
      <button class="primary" onclick="fetchNext()">scan again</button></div>`;
  } else if (stage === "prompt") {
    const c = currentCandidate;
    const needCompassPrompt = !compassActive;
    el.innerHTML = `
      <div class="card">
        <div class="rose-wrap">${roseSVG()}</div>
        <div class="aligned-tag" id="alignedTag"></div>
        <div class="readout">
          <div class="readout-alt">${c.altitude_ft.toLocaleString()}<span style="font-size:14px;color:var(--text-dim);"> ft</span></div>
          <div class="readout-sub">${c.distance_km} km out &middot; <span class="badge">${c.category_hint}</span></div>
          <div class="readout-dir">look toward <b>${c.compass}</b></div>
        </div>
        ${needCompassPrompt ? `
        <div class="compass-permission">
          <div class="hint">turn on your phone's compass to line the arrow up live</div>
          <button onclick="enableCompass()">enable compass</button>
        </div>` : ""}
      </div>
      <div class="row">
        <button onclick="skip()">skip</button>
        <button class="primary" onclick="goGuess()">I see it</button>
      </div>`;
    updateRoseOrientation();
  } else if (stage === "guess") {
    const showRoute = currentCandidate.category_hint === "commercial";
    const airlineOpts = referenceData.airlines.map(a => `<option value="${a}">`).join('');
    const airportOpts = referenceData.airports.map(a => `<option value="${a}">`).join('');
    el.innerHTML = `
      <div class="card">
        <label>Airline / operator</label>
        <input id="gAirline" list="airlineList" placeholder="start typing&hellip;" autocomplete="off">
        <datalist id="airlineList">${airlineOpts}</datalist>
        ${showRoute ? `
        <label>Origin</label>
        <input id="gOrigin" list="airportList" placeholder="start typing&hellip;" autocomplete="off">
        <label>Destination</label>
        <input id="gDest" list="airportList" placeholder="start typing&hellip;" autocomplete="off">
        <datalist id="airportList">${airportOpts}</datalist>` : ""}
      </div>
      <div class="row">
        <button onclick="reveal(true)">lost it</button>
        <button class="primary" onclick="reveal(false)">reveal</button>
      </div>`;
  } else if (stage === "reveal") {
    const r = currentCandidate.revealed;
    el.innerHTML = `
      <div class="card">
        <div class="strip"><span class="callsign">${r.callsign}</span><span class="badge">${r.category}</span></div>
        <div class="meta-line">${r.operator || '&mdash;'} &middot; ${r.altitude_ft.toLocaleString()} ft &middot; ${r.distance_km} km</div>
        <div class="comment">${currentCandidate.comment}</div>
      </div>
      <button class="primary" style="width:100%;" onclick="fetchNext()">spot another</button>`;
  }
}

async function getLocation() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      pos => resolve([pos.coords.latitude, pos.coords.longitude]),
      err => reject(err), { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

async function fetchNext() {
  stage = "loading"; render();
  try {
    if (userLat === null) [userLat, userLon] = await getLocation();
    const res = await fetch(`/api/next?lat=${userLat}&lon=${userLon}`);
    const data = await res.json();
    if (!data.found) { stage = "none"; render(); return; }
    currentCandidate = data;
    stage = "prompt"; render();
  } catch (e) {
    document.getElementById('spotView').innerHTML =
      `<div class="card status">couldn't get your location &mdash; allow location access and reload</div>`;
  }
}

async function skip() {
  stage = "loading"; render();
  const res = await fetch('/api/skip', { method: 'POST' });
  const data = await res.json();
  if (!data.found) { stage = "none"; render(); return; }
  currentCandidate = data;
  stage = "prompt"; render();
}

function goGuess() { stage = "guess"; render(); }

async function reveal(lostSight) {
  const guess = lostSight ? {} : {
    airline: document.getElementById('gAirline')?.value || "",
    origin: document.getElementById('gOrigin')?.value || "",
    destination: document.getElementById('gDest')?.value || "",
  };
  stage = "loading"; render();
  const res = await fetch('/api/reveal', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ guess, lost_sight: lostSight }),
  });
  const data = await res.json();
  currentCandidate.revealed = data.revealed;
  currentCandidate.comment = data.comment;
  stage = "reveal"; render();
}

let activeFilter = 'all';
async function loadHistory(filter) {
  activeFilter = filter;
  const res = await fetch(`/api/history?category=${filter}`);
  const items = await res.json();
  const pills = ['all', 'commercial', 'military', 'private'].map(f =>
    `<span class="pill ${f === activeFilter ? 'active' : ''}" onclick="loadHistory('${f}')">${f}</span>`
  ).join('');
  const rows = items.length ? items.map(h => `
    <div class="hist-item">
      <div>${h.callsign || 'unidentified'}
        <div class="sub">${h.operator || h.category} &middot; ${h.outcome === 'lost_sight' ? 'lost sight' : 'guessed'}</div>
      </div>
      <span class="badge">${h.category}</span>
    </div>`).join('') : `<div class="status">log is empty &mdash; go spot something</div>`;
  document.getElementById('historyView').innerHTML = `
    <div class="card">
      <div class="readout-sub" style="text-align:left;margin-bottom:12px;">${items.length} logged</div>
      <div style="margin-bottom:4px;">${pills}</div>
      ${rows}
    </div>`;
}

fetchNext();
</script>
</body>
</html>
