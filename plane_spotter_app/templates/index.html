<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Plane Spotter</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0A0F0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plane Spotter">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0F0D;
    --panel: #101C17;
    --panel-raised: #14241D;
    --hairline: #1E332B;
    --phosphor: #5EFFA0;
    --phosphor-dim: #2E7A56;
    --amber: #FFB454;
    --amber-dim: #8A6530;
    --text: #E8F5EE;
    --text-dim: #6B8F80;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  body {
    margin: 0; background: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(94,255,160,0.06), transparent);
    color: var(--text); font-family: var(--sans);
    display: flex; justify-content: center; min-height: 100vh;
    padding: calc(env(safe-area-inset-top, 0px) + 34px) 18px 18px;
  }
  #app { width: 100%; max-width: 420px; }

  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--phosphor-dim);
    display: flex; align-items: center; gap: 8px; margin: 2px 0 20px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--phosphor);
    box-shadow: 0 0 6px var(--phosphor); animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .radius-control {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  }
  .radius-control input[type=range] {
    flex: 1; accent-color: var(--phosphor); height: 4px;
  }
  .location-row {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .location-row #locationLabel { color: var(--amber); }
  .link-btn {
    color: var(--phosphor); cursor: pointer; text-decoration: underline;
    text-underline-offset: 2px;
  }
  .candidate-list { border: 1px solid var(--hairline); border-radius: 3px; overflow: hidden; }
  .candidate-item {
    padding: 12px; font-size: 14px; cursor: pointer;
    border-bottom: 1px solid var(--hairline);
  }
  .candidate-item:last-child { border-bottom: none; }
  .candidate-item:hover { background: var(--panel-raised); color: var(--phosphor); }

  .aircraft-list { border: 1px solid var(--hairline); border-radius: 3px; overflow: hidden; }
  .aircraft-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px; cursor: pointer; border-bottom: 1px solid var(--hairline);
  }
  .aircraft-item:last-child { border-bottom: none; }
  .aircraft-item:hover { background: var(--panel-raised); }
  .aircraft-dir { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--amber); margin-bottom: 2px; }
  .aircraft-sub { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .radius-control .val { color: var(--amber); min-width: 52px; text-align: right; }

  .card {
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 4px;
    padding: 22px; margin-bottom: 16px; position: relative;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--phosphor-dim), transparent 60%);
  }

  button {
    flex: 1; padding: 14px; border-radius: 3px; border: 1px solid var(--hairline);
    background: var(--panel-raised); color: var(--text); font-family: var(--sans);
    font-size: 14px; font-weight: 500; cursor: pointer; transition: border-color 0.15s;
  }
  button:hover { border-color: var(--text-dim); }
  button:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }
  button.primary { background: var(--phosphor); border-color: var(--phosphor); color: #04140C; font-weight: 600; }
  .row { display: flex; gap: 10px; }

  label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--amber-dim); display: block; margin-bottom: 6px;
  }

  /* --- custom dropdown (replaces datalist - iOS Safari doesn't render datalist suggestions) --- */
  .field { position: relative; margin-bottom: 14px; }
  .field input {
    width: 100%; padding: 12px; border-radius: 3px; border: 1px solid var(--hairline);
    background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px;
  }
  .field input:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 1px; }
  .dropdown-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--panel-raised); border: 1px solid var(--hairline); border-radius: 3px;
    max-height: 180px; overflow-y: auto; z-index: 20; display: none;
  }
  .dropdown-list.open { display: block; }
  .dropdown-item { padding: 10px 12px; font-size: 14px; cursor: pointer; }
  .dropdown-item:hover, .dropdown-item.highlighted { background: var(--hairline); }
  .dropdown-empty { padding: 10px 12px; font-size: 13px; color: var(--text-dim); font-style: italic; }

  /* --- Compass --- */
  .rose-wrap { display: flex; justify-content: center; margin: 4px 0 6px; position: relative; }
  .rose { width: 176px; height: 176px; }
  .rose-ring { fill: none; stroke: var(--hairline); stroke-width: 1; }
  .rose-tick.major { stroke: var(--phosphor-dim); stroke-width: 1.5; }
  .rose-label { fill: var(--text-dim); font-family: var(--mono); font-size: 9px; text-anchor: middle; }
  .rose-label.north { fill: var(--amber); font-weight: 700; }
  .heading-wedge { fill: var(--phosphor); opacity: 0.18; transition: transform 0.15s linear; transform-origin: 88px 88px; }
  .target-needle { transition: transform 0.4s cubic-bezier(.2,.9,.3,1); transform-origin: 88px 88px; }
  .target-needle.aligned .needle-line { stroke: var(--phosphor); filter: drop-shadow(0 0 6px var(--phosphor)); }
  .needle-line { stroke: var(--amber); stroke-width: 2.5; transition: stroke 0.2s; }
  .rose-center { fill: var(--bg); stroke: var(--text-dim); stroke-width: 1.5; }
  .align-pulse { fill: none; stroke: var(--phosphor); stroke-width: 1.5; opacity: 0; }
  .align-pulse.active { animation: pulse-ring 1.4s ease-out infinite; }
  @keyframes pulse-ring { 0% { r: 46; opacity: 0.7; } 100% { r: 82; opacity: 0; } }

  .aligned-tag {
    text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--phosphor); height: 16px; margin-bottom: 6px;
  }

  .readout { text-align: center; }
  .readout-alt { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: -0.01em; line-height: 1; }
  .readout-sub { font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-top: 8px; }
  .readout-dir { font-size: 15px; margin-top: 12px; color: var(--text-dim); }
  .readout-dir b { color: var(--amber); font-family: var(--mono); font-weight: 600; }

  .badge {
    display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 3px;
    border: 1px solid var(--amber-dim); color: var(--amber);
  }

  .compass-permission { text-align: center; padding: 10px 0 4px; }
  .compass-permission .hint { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }

  .sweep-wrap { display: flex; flex-direction: column; align-items: center; padding: 30px 0; gap: 16px; }
  .sweep { width: 90px; height: 90px; border-radius: 50%; border: 1px solid var(--hairline); position: relative; overflow: hidden; }
  .sweep::after {
    content: ''; position: absolute; inset: 0;
    background: conic-gradient(from 0deg, var(--phosphor) 0deg, transparent 60deg);
    animation: rotate 1.6s linear infinite; opacity: 0.55;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }
  .sweep.amber { border-color: var(--amber-dim); overflow: visible; }
  .sweep.amber::after {
    background: none;
    box-shadow: none;
  }
  .sweep.amber::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--amber); opacity: 0;
    animation: pulse-fill 1.6s ease-out infinite;
  }
  @keyframes pulse-fill {
    0% { transform: scale(0.4); opacity: 0.9; }
    100% { transform: scale(1.15); opacity: 0; }
  }
  .sweep-label { font-family: var(--mono); font-size: 12px; color: var(--text-dim); letter-spacing: 0.04em; }

  /* --- Reveal breakdown --- */
  .photo-wrap {
    width: 100%; height: 140px; border-radius: 3px; overflow: hidden;
    background: var(--bg); border: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
  }
  .photo { width: 100%; height: 100%; object-fit: cover; }
  .silhouette { width: 70%; height: 70%; }

  .hist-delete {
    flex: none; width: 28px; height: 28px; padding: 0; margin-left: 8px;
    border-radius: 3px; background: none; border: 1px solid var(--hairline);
    color: var(--text-dim); font-size: 14px; line-height: 1;
  }
  .hist-delete:hover { color: #ff6b6b; border-color: #ff6b6b; }

  .strip { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .callsign { font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: 0.02em; }
  .operator-line { font-family: var(--sans); font-size: 14px; color: var(--text-dim); margin-bottom: 4px; }
  .route-line { font-family: var(--mono); font-size: 13px; color: var(--amber); margin-bottom: 16px; }
  .comment {
    font-family: var(--sans); font-style: italic; font-size: 14px; color: var(--text);
    background: var(--bg); border-left: 2px solid var(--phosphor-dim);
    padding: 10px 14px; border-radius: 0 3px 3px 0; margin-bottom: 18px;
  }
  .map-wrap {
    border: 1px solid var(--hairline); border-radius: 3px; overflow: hidden;
    margin-bottom: 18px; height: 180px;
  }
  #flightMap { width: 100%; height: 100%; background: var(--bg); }
  #flightMap .leaflet-tile-pane { filter: invert(92%) hue-rotate(180deg) brightness(0.9) contrast(0.9) saturate(0.5); }
  .leaflet-tooltip { background: var(--panel-raised); color: var(--text); border: 1px solid var(--hairline); font-family: var(--mono); font-size: 11px; }
  .leaflet-control-attribution { background: rgba(10,15,13,0.7) !important; color: var(--text-dim) !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: var(--text-dim) !important; }
  .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); border-radius: 3px; overflow: hidden; }
  .data-cell { background: var(--panel); padding: 10px 12px; }
  .data-cell.wide { grid-column: 1 / -1; }
  .data-cell.correct { background: rgba(94,255,160,0.10); box-shadow: inset 2px 0 0 var(--phosphor); }
  .data-cell.wrong { background: rgba(255,107,107,0.10); box-shadow: inset 2px 0 0 #ff6b6b; }
  .data-cell .k { font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber-dim); margin-bottom: 3px; }
  .data-cell .v { font-family: var(--mono); font-size: 15px; color: var(--text); }

  .tabbar { display: flex; gap: 20px; margin-bottom: 18px; border-bottom: 1px solid var(--hairline); }
  .tabbar button {
    flex: none; background: none; border: none; border-radius: 0; color: var(--text-dim);
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0 0 12px; position: relative;
  }
  .tabbar button.active { color: var(--phosphor); }
  .tabbar button.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--phosphor); box-shadow: 0 0 6px var(--phosphor);
  }

  .pill {
    display: inline-block; font-family: var(--mono); font-size: 11px; padding: 5px 10px;
    border-radius: 3px; background: var(--panel-raised); color: var(--text-dim);
    margin: 0 6px 6px 0; cursor: pointer; border: 1px solid var(--hairline);
  }
  .pill.active { border-color: var(--phosphor); color: var(--phosphor); }
  .hist-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--hairline); font-family: var(--mono); font-size: 13px;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-item .sub { color: var(--text-dim); font-size: 11px; font-family: var(--sans); margin-top: 2px; }

  .status { text-align: center; color: var(--text-dim); padding: 30px 0; font-family: var(--sans); font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <div class="eyebrow"><span class="dot"></span> plane spotter</div>

  <div class="radius-control">
    <span>radius</span>
    <input type="range" id="radiusSlider" min="2" max="60" value="15" oninput="onRadiusInput(this.value)">
    <span class="val" id="radiusVal">15 km</span>
  </div>

  <div class="location-row">
    location: <span id="locationLabel">device GPS</span>
    <span class="link-btn" onclick="showPostcodeInput()">change</span>
  </div>

  <div class="tabbar">
    <button id="tabSpot" class="active" onclick="showTab('spot')">Spot</button>
    <button id="tabHistory" onclick="showTab('history')">Log</button>
  </div>
  <div id="spotView"></div>
  <div id="historyView" style="display:none;"></div>
</div>

<script>
let userLat = null, userLon = null;
let currentCandidate = null;
let stage = "idle"; // idle | loading | picker | prompt | guess | revealing | reveal | none
let started = false;
let deviceHeading = null;
let compassActive = false;
let referenceData = { airlines: [], airports: [] };
let radiusKm = 15;
let radiusDebounce = null;
console.log('plane spotter frontend: v17 (fixed map tiles + destination removed from map)');

fetch('/api/reference-data').then(r => r.json()).then(d => { referenceData = d; });

function onRadiusInput(val) {
  radiusKm = Number(val);
  document.getElementById('radiusVal').textContent = radiusKm + ' km';
  if (!started) return; // don't kick off a scan just from adjusting the slider before starting
  clearTimeout(radiusDebounce);
  radiusDebounce = setTimeout(() => { loadAircraftList(); }, 500);
}

function showTab(tab) {
  document.getElementById('tabSpot').classList.toggle('active', tab === 'spot');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('spotView').style.display = tab === 'spot' ? 'block' : 'none';
  document.getElementById('historyView').style.display = tab === 'history' ? 'block' : 'none';
  if (tab === 'history') loadHistory(activeFilter || 'all');
}

/* ---------- custom dropdown (works on iOS Safari, unlike <datalist>) ---------- */
function setupDropdown(inputId, listId, options) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if (!input || !list) return;
  let highlighted = -1;

  function renderOptions(filter) {
    const q = (filter || '').trim().toLowerCase();
    const matches = q ? options.filter(o => o.toLowerCase().includes(q)) : options;
    highlighted = -1;
    if (!matches.length) {
      list.innerHTML = `<div class="dropdown-empty">no matches &mdash; you can still type your own</div>`;
    } else {
      list.innerHTML = matches.slice(0, 30).map((o, i) =>
        `<div class="dropdown-item" data-idx="${i}" onclick="selectDropdownItem('${inputId}','${listId}', this.textContent)">${o}</div>`
      ).join('');
    }
    list.classList.add('open');
  }

  input.addEventListener('focus', () => renderOptions(input.value));
  input.addEventListener('input', () => renderOptions(input.value));
  input.addEventListener('blur', () => setTimeout(() => list.classList.remove('open'), 150));
}

function selectDropdownItem(inputId, listId, text) {
  document.getElementById(inputId).value = text;
  document.getElementById(listId).classList.remove('open');
}

/* ---------- compass rose rendering ---------- */
function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

function roseSVG() {
  const points = ['N','NE','E','SE','S','SW','W','NW'];
  const ticks = points.map((p, i) => {
    const angle = i * 45;
    const [x1, y1] = polarPoint(88, 88, 66, angle);
    const [x2, y2] = polarPoint(88, 88, 76, angle);
    const [lx, ly] = polarPoint(88, 88, 54, angle);
    return `<line class="rose-tick major" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>
            <text class="rose-label ${p === 'N' ? 'north' : ''}" x="${lx}" y="${ly + 3}">${p}</text>`;
  }).join('');
  return `
    <svg class="rose" viewBox="0 0 176 176">
      <circle class="align-pulse" id="alignPulse" cx="88" cy="88" r="46"/>
      <circle class="rose-ring" cx="88" cy="88" r="76"/>
      <circle class="rose-ring" cx="88" cy="88" r="46"/>
      ${ticks}
      <polygon class="heading-wedge" id="headingWedge" points="88,88 78,20 98,20"/>
      <g class="target-needle" id="targetNeedle">
        <line class="needle-line" x1="88" y1="88" x2="88" y2="24"/>
        <line class="needle-line" x1="88" y1="88" x2="88" y2="128" stroke-opacity="0.3"/>
      </g>
      <circle class="rose-center" cx="88" cy="88" r="4"/>
    </svg>`;
}

function updateRoseOrientation() {
  const wedge = document.getElementById('headingWedge');
  const needle = document.getElementById('targetNeedle');
  const pulse = document.getElementById('alignPulse');
  const tag = document.getElementById('alignedTag');
  if (!wedge || !needle || !currentCandidate) return;
  const target = currentCandidate.bearing_deg;

  if (deviceHeading !== null) {
    wedge.style.transform = `rotate(${deviceHeading}deg)`;
    wedge.style.opacity = '0.18';
  } else {
    wedge.style.opacity = '0';
  }
  needle.style.transform = `rotate(${target}deg)`;

  if (deviceHeading !== null) {
    const diff = Math.abs(((deviceHeading - target + 540) % 360) - 180);
    const aligned = diff < 12;
    needle.classList.toggle('aligned', aligned);
    if (pulse) pulse.classList.toggle('active', aligned);
    if (tag) tag.textContent = aligned ? 'facing it now' : '';
  }
}

function handleOrientation(event) {
  let heading = null;
  if (typeof event.webkitCompassHeading === 'number') {
    heading = event.webkitCompassHeading;
  } else if (event.absolute && event.alpha !== null) {
    heading = (360 - event.alpha) % 360;
  }
  if (heading !== null) {
    deviceHeading = heading;
    compassActive = true;
    updateRoseOrientation();
  }
}

async function enableCompass() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const result = await DeviceOrientationEvent.requestPermission();
      if (result !== 'granted') return;
    } catch (e) { return; }
  }
  window.addEventListener('deviceorientationabsolute', handleOrientation, true);
  window.addEventListener('deviceorientation', handleOrientation, true);
  render();
}

/* ---------- rendering ---------- */
let flightMapInstance = null;

function hasFlightPathData(r) {
  return (r.trace_points && r.trace_points.length >= 2) || r.origin_coords || r.current_coords;
}

function initFlightMap(r) {
  // Called after the reveal card's HTML (including #flightMap div) is
  // already in the DOM - Leaflet needs a real element to attach to.
  if (flightMapInstance) { flightMapInstance.remove(); flightMapInstance = null; }
  const el = document.getElementById('flightMap');
  if (!el || typeof L === 'undefined') return;

  const map = L.map('flightMap', {
    zoomControl: false, attributionControl: true, dragging: true,
    scrollWheelZoom: false, tap: false,
  });
  flightMapInstance = map;

  // Standard OpenStreetMap tiles (free, no key) - a CSS filter on the
  // tile pane (see .leaflet-tile-pane rule) darkens it to match the
  // app's theme, since CARTO's free dark tiles now require a key.
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  const bounds = [];
  const hasTrace = r.trace_points && r.trace_points.length >= 2;

  if (hasTrace) {
    // The real flown path - what the aircraft has actually done.
    const latlngs = r.trace_points.map(p => [p.lat, p.lon]);
    L.polyline(latlngs, { color: '#5EFFA0', weight: 2.5, opacity: 0.8 }).addTo(map);
    latlngs.forEach(p => bounds.push(p));
  } else if (r.origin_coords && r.current_coords) {
    // No real trace available - approximate "where it's been" as a
    // line from its origin airport to its current position (never to
    // the destination, which hasn't happened yet).
    const line = [[r.origin_coords.lat, r.origin_coords.lon], [r.current_coords.lat, r.current_coords.lon]];
    L.polyline(line, { color: '#6B8F80', weight: 2, opacity: 0.7, dashArray: '5 6' }).addTo(map);
    bounds.push(...line);
  }

  if (r.origin_coords) {
    L.circleMarker([r.origin_coords.lat, r.origin_coords.lon], { radius: 5, color: '#FFB454', fillColor: '#FFB454', fillOpacity: 1, weight: 1 })
      .bindTooltip('origin', { permanent: false }).addTo(map);
    bounds.push([r.origin_coords.lat, r.origin_coords.lon]);
  }
  if (r.current_coords) {
    L.circleMarker([r.current_coords.lat, r.current_coords.lon], { radius: 6, color: '#5EFFA0', fillColor: '#5EFFA0', fillOpacity: 1, weight: 2 })
      .bindTooltip('current position', { permanent: false }).addTo(map);
    bounds.push([r.current_coords.lat, r.current_coords.lon]);
  }

  if (bounds.length >= 2) {
    map.fitBounds(bounds, { padding: [20, 20] });
  } else if (bounds.length === 1) {
    map.setView(bounds[0], 9);
  }
}

function silhouetteMarkup(category) {
  if (category === 'military') {
    return `<svg viewBox="0 0 120 60" class="silhouette">
      <path d="M10 30 L45 26 L55 8 L62 8 L58 26 L78 26 L92 14 L98 14 L90 30 L98 46 L92 46 L78 34 L58 34 L62 52 L55 52 L45 34 L10 30 Z" fill="var(--text-dim)" opacity="0.5"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 120 60" class="silhouette">
    <path d="M6 30 L48 28 L58 6 L64 6 L60 28 L100 28 L112 22 L116 24 L106 32 L116 40 L112 42 L100 36 L60 36 L64 54 L58 54 L48 32 L6 32 Z" fill="var(--text-dim)" opacity="0.5"/>
  </svg>`;
}

function render() {
  const el = document.getElementById('spotView');
  if (stage === "idle") {
    el.innerHTML = `
      <div class="card status">
        set your radius and location above, then start scanning when you're ready
        <div class="row" style="margin-top:14px;">
          <button class="primary" style="flex:1;" onclick="startScanning()">start scanning</button>
        </div>
      </div>`;
  } else if (stage === "loading") {
    const locBit = locationMode === 'manual' ? (manualLabel || 'your chosen location') : 'your location';
    el.innerHTML = `<div class="card"><div class="sweep-wrap">
      <div class="sweep"></div>
      <div class="sweep-label">scanning ${radiusKm}km around ${locBit}&hellip;</div>
    </div></div>`;
  } else if (stage === "revealing") {
    el.innerHTML = `<div class="card"><div class="sweep-wrap">
      <div class="sweep amber"></div>
      <div class="sweep-label">pulling up the details&hellip;</div>
    </div></div>`;
  } else if (stage === "none") {
    const locBit = locationMode === 'manual' ? (manualLabel || 'that location') : 'your location';
    el.innerHTML = `
      <div class="card status">
        no traffic within ${radiusKm}km of ${locBit} right now.<br>
        <span style="color:var(--text-dim);font-size:12px;">try a wider radius, or check back in a bit &mdash; the sky isn't always busy.</span>
        <div class="row" style="margin-top:16px;">
          <button onclick="widenAndScan()">widen radius</button>
          <button class="primary" onclick="loadAircraftList()">scan again</button>
        </div>
      </div>`;
  } else if (stage === "prompt") {
    const c = currentCandidate;
    const needCompassPrompt = !compassActive;
    el.innerHTML = `
      <div class="card">
        <div class="rose-wrap">${roseSVG()}</div>
        <div class="aligned-tag" id="alignedTag"></div>
        <div class="readout">
          <div class="readout-alt">${c.altitude_ft.toLocaleString()}<span style="font-size:14px;color:var(--text-dim);"> ft</span></div>
          <div class="readout-sub">${c.distance_km} km out &middot; <span class="badge">${c.category_hint}</span></div>
          <div class="readout-dir">look toward <b>${c.compass}</b></div>
        </div>
        ${needCompassPrompt ? `
        <div class="compass-permission">
          <div class="hint">turn on your phone's compass to line the arrow up live</div>
          <button onclick="enableCompass()">enable compass</button>
        </div>` : ""}
      </div>
      <div class="row">
        <button onclick="loadAircraftList()">choose another</button>
        <button class="primary" onclick="goGuess()">I see it</button>
      </div>`;
    updateRoseOrientation();
  } else if (stage === "picker") {
    const rows = aircraftList.map(a => `
      <div class="aircraft-item" onclick="pickAircraft(${a.index})">
        <div class="aircraft-main">
          <div class="aircraft-dir">look ${a.compass}</div>
          <div class="aircraft-sub">${a.altitude_ft.toLocaleString()} ft</div>
        </div>
      </div>`).join('');
    el.innerHTML = `
      <div class="card">
        <div class="readout-sub" style="text-align:left;margin-bottom:12px;">${aircraftList.length} in range &mdash; tap the one you're looking at</div>
        <div class="aircraft-list">${rows}</div>
      </div>
      <div class="row">
        <button style="flex:1;" onclick="loadAircraftList()">rescan</button>
      </div>`;
  } else if (stage === "guess") {
    const showRoute = currentCandidate.category_hint === "commercial";
    el.innerHTML = `
      <div class="card">
        <div class="field">
          <label>Airline / operator</label>
          <input id="gAirline" placeholder="start typing&hellip;" autocomplete="off">
          <div class="dropdown-list" id="gAirlineList"></div>
        </div>
        <div class="field">
          <label>Aircraft type</label>
          <input id="gType" placeholder="e.g. Airbus A320" autocomplete="off">
          <div class="dropdown-list" id="gTypeList"></div>
        </div>
        ${showRoute ? `
        <div class="field">
          <label>Origin</label>
          <input id="gOrigin" placeholder="start typing&hellip;" autocomplete="off">
          <div class="dropdown-list" id="gOriginList"></div>
        </div>
        <div class="field">
          <label>Destination</label>
          <input id="gDest" placeholder="start typing&hellip;" autocomplete="off">
          <div class="dropdown-list" id="gDestList"></div>
        </div>` : ""}
      </div>
      <div class="row">
        <button onclick="reveal(true)">lost it</button>
        <button class="primary" onclick="reveal(false)">reveal</button>
      </div>`;
    setupDropdown('gAirline', 'gAirlineList', referenceData.airlines);
    setupDropdown('gType', 'gTypeList', referenceData.aircraft_types);
    if (showRoute) {
      setupDropdown('gOrigin', 'gOriginList', referenceData.airports);
      setupDropdown('gDest', 'gDestList', referenceData.airports);
    }
  } else if (stage === "reveal") {
    const r = currentCandidate.revealed;
    const routeLine = (r.origin || r.destination)
      ? `${r.origin || 'unknown'} &rarr; ${r.destination || 'unknown'}`
      : null;
    const cells = [
      ['Operator', r.operator || 'unknown'],
      ['Aircraft type', r.aircraft_type || 'unknown'],
      ['Category', r.category],
      ['Aircraft ID', r.icao24],
      ['Origin', r.origin || 'unknown'],
      ['Destination', r.destination || 'unknown'],
      ['Altitude', r.altitude_ft.toLocaleString() + ' ft'],
      ['Distance', r.distance_km + ' km'],
      ['Ground speed', r.speed_mph ? r.speed_mph + ' mph' : 'n/a'],
      ['Heading', r.heading_compass ? r.heading_compass + ' (' + r.heading_deg + '\u00b0)' : 'n/a'],
      ['You looked', r.look_compass],
    ];
    const wideKeys = new Set(['Origin', 'Destination']);
    const resultKeyByLabel = {
      'Operator': 'airline',
      'Aircraft type': 'aircraft_type',
      'Origin': 'origin',
      'Destination': 'destination',
    };
    const guessResult = currentCandidate.guessResult || {};
    const showMap = hasFlightPathData(r);
    el.innerHTML = `
      <div class="card">
        <div class="photo-wrap">
          ${r.photo || r.photo_thumb
            ? `<img src="${r.photo || r.photo_thumb}" class="photo" alt="${r.aircraft_type || 'aircraft'}" onerror="this.parentElement.innerHTML=silhouetteMarkup('${r.category}')">`
            : silhouetteMarkup(r.category)}
        </div>
        <div class="strip"><span class="callsign">${r.callsign}</span><span class="badge">${r.category}</span></div>
        <div class="operator-line">${r.operator || 'operator unknown'}</div>
        ${routeLine ? `<div class="route-line">${routeLine}</div>` : ""}
        <div class="comment">${currentCandidate.comment}</div>
        ${showMap ? `<div class="map-wrap"><div id="flightMap"></div></div>` : ""}
        <div class="data-grid">
          ${cells.map(([k, v]) => {
            const resultKey = resultKeyByLabel[k];
            const match = resultKey ? guessResult[resultKey] : null;
            const cls = [wideKeys.has(k) ? 'wide' : '', match === true ? 'correct' : match === false ? 'wrong' : ''].join(' ').trim();
            return `<div class="data-cell ${cls}"><div class="k">${k}</div><div class="v" style="${wideKeys.has(k) ? 'font-size:13px;' : ''}">${v}</div></div>`;
          }).join('')}
        </div>
      </div>
      <button class="primary" style="width:100%;" onclick="loadAircraftList()">spot another</button>`;
    if (showMap) initFlightMap(r);
  }
}

async function getLocation() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      pos => resolve([pos.coords.latitude, pos.coords.longitude]),
      err => reject(err), { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

let locationMode = 'gps'; // 'gps' | 'manual'
let manualLabel = null;
let aircraftList = [];

async function loadAircraftList() {
  stage = "loading"; render();

  if (userLat === null && locationMode === 'gps') {
    try {
      [userLat, userLon] = await getLocation();
    } catch (e) {
      showLocationError('gps');
      return;
    }
  }

  try {
    const res = await fetch(`/api/candidates?lat=${userLat}&lon=${userLon}&radius=${radiusKm}`);
    if (!res.ok) throw new Error('backend');
    const data = await res.json();
    aircraftList = data.candidates || [];
    if (!aircraftList.length) { stage = "none"; render(); return; }
    stage = "picker"; render();
  } catch (e) {
    showLocationError('backend');
  }
}

async function pickAircraft(index) {
  stage = "loading"; render();
  try {
    const res = await fetch('/api/select', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index }),
    });
    if (!res.ok) throw new Error('select failed');
    const data = await res.json();
    if (!data.found) { stage = "none"; render(); return; }
    currentCandidate = data;
    stage = "prompt"; render();
  } catch (e) {
    showLocationError('backend');
  }
}

function showLocationError(kind) {
  const msg = kind === 'gps'
    ? "couldn't get your phone's location &mdash; check location permission is allowed for this app"
    : "couldn't reach the server &mdash; if you just opened this after a while, it may still be waking up. Try again in a moment.";
  document.getElementById('spotView').innerHTML = `
    <div class="card status">
      ${msg}
      <div class="row" style="margin-top:14px;">
        <button onclick="loadAircraftList()">try again</button>
        <button class="primary" onclick="showPostcodeInput()">use postcode instead</button>
      </div>
    </div>`;
}

function showPostcodeInput() {
  document.getElementById('spotView').innerHTML = `
    <div class="card">
      <label>Postcode or place name</label>
      <input id="postcodeInput" placeholder="e.g. TR8 4RS or Newquay" autocomplete="off">
      <div class="row" style="margin-top:4px;">
        <button onclick="useGPS()">use GPS instead</button>
        <button class="primary" onclick="submitPostcode()">go</button>
      </div>
    </div>`;
  document.getElementById('postcodeInput').focus();
}

function updateLocationLabel() {
  const el = document.getElementById('locationLabel');
  if (!el) return;
  el.textContent = locationMode === 'manual' ? (manualLabel || 'custom location') : 'device GPS';
}

function widenAndScan() {
  radiusKm = Math.min(radiusKm + 15, 60);
  document.getElementById('radiusSlider').value = radiusKm;
  document.getElementById('radiusVal').textContent = radiusKm + ' km';
  loadAircraftList();
}

function startScanning() {
  started = true;
  loadAircraftList();
}

function useGPS() {
  locationMode = 'gps'; manualLabel = null; userLat = null; userLon = null;
  updateLocationLabel();
  if (started) { loadAircraftList(); } else { stage = 'idle'; render(); }
}

async function submitPostcode() {
  const query = document.getElementById('postcodeInput')?.value?.trim();
  if (!query) return;
  stage = "loading"; render();
  try {
    const res = await fetch(`/api/geocode?query=${encodeURIComponent(query)}`);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    const candidates = data.candidates || [];
    if (!candidates.length) throw new Error('not found');
    if (candidates.length === 1) {
      applyLocation(candidates[0]);
    } else {
      showLocationPicker(candidates);
    }
  } catch (e) {
    document.getElementById('spotView').innerHTML = `
      <div class="card status">
        couldn't find that postcode/place &mdash; try a different spelling
        <div class="row" style="margin-top:14px;">
          <button class="primary" onclick="showPostcodeInput()">try again</button>
        </div>
      </div>`;
  }
}

function showLocationPicker(candidates) {
  const rows = candidates.map((c, i) =>
    `<div class="candidate-item" onclick="pickLocationCandidate(${i})">${c.label}</div>`
  ).join('');
  window._geocodeCandidates = candidates; // stash for pickLocationCandidate
  document.getElementById('spotView').innerHTML = `
    <div class="card">
      <label>Which one did you mean?</label>
      <div class="candidate-list">${rows}</div>
      <div class="row" style="margin-top:14px;">
        <button onclick="showPostcodeInput()">try a different search</button>
      </div>
    </div>`;
}

function pickLocationCandidate(index) {
  const c = (window._geocodeCandidates || [])[index];
  if (c) applyLocation(c);
}

function applyLocation(c) {
  userLat = c.lat; userLon = c.lon;
  locationMode = 'manual'; manualLabel = c.label;
  updateLocationLabel();
  if (started) { loadAircraftList(); } else { stage = 'idle'; render(); }
}

function goGuess() { stage = "guess"; render(); }

async function reveal(lostSight) {
  const guess = lostSight ? {} : {
    airline: document.getElementById('gAirline')?.value || "",
    aircraft_type: document.getElementById('gType')?.value || "",
    origin: document.getElementById('gOrigin')?.value || "",
    destination: document.getElementById('gDest')?.value || "",
  };
  stage = "revealing"; render();
  const res = await fetch('/api/reveal', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ guess, lost_sight: lostSight }),
  });
  const data = await res.json();
  currentCandidate.revealed = data.revealed;
  currentCandidate.comment = data.comment;
  currentCandidate.guessResult = data.guess_result || {};
  stage = "reveal"; render();
}

let activeFilter = 'all';
async function loadHistory(filter) {
  activeFilter = filter;
  const res = await fetch(`/api/history?category=${filter}`);
  const items = await res.json();
  const pills = ['all', 'commercial', 'military', 'private'].map(f =>
    `<span class="pill ${f === activeFilter ? 'active' : ''}" onclick="loadHistory('${f}')">${f}</span>`
  ).join('');
  const rows = items.length ? items.map(h => `
    <div class="hist-item" id="hist-${h.id}">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
        ${h.photo_thumb ? `<img src="${h.photo_thumb}" style="width:34px;height:34px;object-fit:cover;border-radius:3px;flex:none;">` : ''}
        <div style="min-width:0;">
          ${h.callsign || 'unidentified'}
          <div class="sub">${h.aircraft_type || h.operator || h.category} &middot; ${h.outcome === 'lost_sight' ? 'lost sight' : 'guessed'}</div>
        </div>
      </div>
      <span class="badge">${h.category}</span>
      <button class="hist-delete" onclick="deleteHistoryEntry('${h.id}')" aria-label="delete">&times;</button>
    </div>`).join('') : `<div class="status">log is empty &mdash; go spot something</div>`;
  document.getElementById('historyView').innerHTML = `
    <div class="card">
      <div class="readout-sub" style="text-align:left;margin-bottom:12px;">${items.length} logged</div>
      <div style="margin-bottom:4px;">${pills}</div>
      ${rows}
    </div>`;
}

async function deleteHistoryEntry(id) {
  const row = document.getElementById(`hist-${id}`);
  if (row) row.style.opacity = '0.3';
  await fetch(`/api/history/${id}`, { method: 'DELETE' });
  loadHistory(activeFilter);
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  });
}
</script>
